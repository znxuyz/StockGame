<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- index.html 不快取(只 ~2KB),確保部署新版後 Safari 不會用舊 HTML
         指向被 cleanupOutdatedCaches 清掉的舊 JS/CSS hash → 白屏。
         這個 meta 只影響 index.html 本身,不影響 SW 對 JS/CSS/asset 的快取策略 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- 新 favicon(九尾狐 PNG)。SVG 舊版 icon.svg 已不再用,留檔以備不時之需 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- theme-color #f3ecd7 = HUD glass over Phaser 米紙底實際呈現的暖米黃
         (rgba 250,246,232,0.35 over #efe6cf source-over)。比 #faf6e8 純米白
         更貼近玩家看到的 HUD 色,瀏海區跟 HUD 視覺上完全融合(階段 6.Y)。
         App.tsx 啟動後讀 --hud-effective-bg CSS 變數動態 sync(切主題色時
         也跟著變);splash 期間切換到 cover.png 頂緣取樣 RGB。 -->
    <meta name="theme-color" content="#f3ecd7" />
    <meta name="background-color" content="#f3ecd7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent:狀態列底色透明,讓 web 內容延伸進瀏海 / Dynamic Island 區
         配合 env(safe-area-inset-*) padding 把文字壓回安全區內。
         若用 default 系統會幫忙畫不透明米色狀態列,splash / HUD 永遠到不了真正頂端 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="神獸股市" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>山海經股票養成 · 神獸股市</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
